plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.kmd5a9_szakmaigyakorlat'
    compileSdk 36 // Android 15 (API 35) a stabil verzió

    defaultConfig {
        applicationId "com.example.kmd5a9_szakmaigyakorlat"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 16 KB-os oldalméret támogatás engedélyezése
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_16KB_PAGE_SIZE=true"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile rootProject.file("keystore/medscan-debug.jks")
            storePassword "android"
            keyAlias "medscan-debug"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Java 17 ajánlott az újabb SDK-khoz
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(path: ':sdk')

    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.material


    // Google Bejelentkezés - Frissítve
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // ML Kit - Frissítve a legújabb 16KB-kompatibilis verzióra
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'

    // Firebase Storage - Frissítve
    implementation 'com.google.firebase:firebase-storage:21.0.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide - Frissítve
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // PhotoView
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Guava - Frissítve
    implementation 'com.google.guava:guava:33.2.1-android'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.7.3'

    // CameraX - Frissítve 1.4.0-ra (16KB támogatással)
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"


    // Tesztelés
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}